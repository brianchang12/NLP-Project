[project]
name = "nlp_project"
description = "Project for NLP UT Austin class"
version = "0.1.0"
authors = [
    { name = "Brian Chang", email = "brian.bcyvr@gmail.com" }
]
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "pillow",
    "torchvision",
    "transformers[torch]",
]

[project.optional-dependencies]
dev = [
    "black",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
